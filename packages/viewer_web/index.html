<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>NAYA viewer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="hud">
      <div class="label" id="status">Model yükleniyor…</div>
      <div class="part" id="part" hidden>
        <span class="tag">Parça</span>
        <strong id="part-name"></strong>
      </div>
    </div>
    <div class="controls">
      <button id="explode" title="Parçalarına ayır">Parçala</button>
      <button id="xray" title="X-ışını">X-ışını</button>
      <button id="scan" title="Örnek teşhis taraması">Tara</button>
      <button id="reset" title="Görünümü sıfırla">Sıfırla</button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
