name: naya
description: NAYA uygulaması (web ve Android).
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  google_fonts: ^6.2.0
  http: ^1.6.0
  naya_format: any
  naya_s1000d: any
  pointer_interceptor: ^0.10.1
  web: ^1.1.0
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    # Gömülü 3D viewer (packages/viewer_web: npm run bundle)
    - assets/viewer/
    - assets/viewer/assets/
    - assets/viewer/draco/
    - assets/viewer/models/
