name: naya
description: NAYA uygulaması (web ve Android).
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.0
  web: ^1.1.0
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    # Gömülü 3D viewer (packages/viewer_web: npm run bundle)
    - assets/viewer/
    - assets/viewer/assets/
    - assets/viewer/draco/
    - assets/viewer/models/
