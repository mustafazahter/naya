# PR'larda kontrol: biçim, analiz (FSD kuralı dahil), testler, viewer tip kontrolü.
# main'e birleşince ayrıca web build ve APK üretilir, Actions sayfasından indirilir.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Aynı dala art arda push gelirse eski çalışma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Yerelde kullandığımız sürümle aynı tutulur.
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    name: Analiz ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıklar
        run: |
          flutter pub get
          # fsd_lint workspace dışında; analyzer eklentisi olarak ayrıca çözülür.
          (cd tools/fsd_lint && dart pub get)

      - name: Biçim
        run: dart format --output=none --set-exit-if-changed .

      - name: Analiz
        run: dart analyze --fatal-infos

      - name: Dart testleri
        run: |
          # test/ klasörü olan her saf Dart paketi.
          for dir in packages/*/ apps/naya_api/ tools/*/; do
            if [[ -d "$dir/test" && -f "$dir/pubspec.yaml" ]]; then
              echo "::group::$dir"
              (cd "$dir" && dart test)
              echo "::endgroup::"
            fi
          done

      - name: Flutter testleri
        working-directory: apps/naya
        run: flutter test

  viewer:
    name: Viewer kontrolü
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/viewer_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/viewer_web/package-lock.json

      - run: npm ci
      - run: npm run build

  build:
    name: Web ve APK
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [check, viewer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Web build
        working-directory: apps/naya
        run: flutter build web --release

      - name: APK
        working-directory: apps/naya
        # İmza şimdilik debug anahtarıyla; telefona adb ile kurmak için yeterli.
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: naya-web
          path: apps/naya/build/web
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: naya-apk
          path: apps/naya/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
