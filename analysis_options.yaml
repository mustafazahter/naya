# Workspace'teki tüm paketler (Flutter uygulaması dahil) bu ayarları kullanır.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_lambdas

# FSD katman kuralı (apps/naya): bir katman yalnız kendinden alttakileri
# import eder. Eklenti workspace kökünde tanımlanmak zorunda.
plugins:
  fsd_lint:
    path: tools/fsd_lint
    diagnostics:
      fsd_layer_import: true
